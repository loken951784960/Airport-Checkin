name: "Airport Checkin"

on:
  schedule:
    # GitHub 在高峰时段的 schedule 会延迟甚至跳过，因此设置多个时间点；
    # 每个 run 开头由 guard step 检查「10 小时内是否已有成功运行」，保证每天只真正执行一次
    - cron: "17 16 * * *"  # 北京 00:17（主）
    - cron: "17 18 * * *"  # 北京 02:17（兜底 1）
    - cron: "17 20 * * *"  # 北京 04:17（兜底 2）
    - cron: "47 22 * * *"  # 北京 06:47（兜底 3）
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: airport-checkin-daily
  cancel-in-progress: false

env:
  RUN_ENV: 'prod'

jobs:
  build:
    runs-on: ubuntu-latest
    # if: github.ref == 'refs/heads/master'

    steps:
      - name: Guard - 当天已成功执行过则跳过
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          WF_FILE="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_FILE##*/}"
          echo "workflow file: $WF_FILE"
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF_FILE" \
                 --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || true)
          echo "last success run: ${LAST:-<none>}"
          if [ -n "$LAST" ]; then
            LAST_EPOCH=$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            DIFF=$(( NOW_EPOCH - LAST_EPOCH ))
            echo "seconds since last success: $DIFF"
            if [ "$DIFF" -lt 36000 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "10 小时内已有成功运行，跳过本次"
              exit 0
            fi
          fi
          RUNNING=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF_FILE" \
                    --status in_progress --limit 5 --json databaseId --jq 'length' 2>/dev/null || true)
          echo "in_progress runs (incl. self): ${RUNNING:-0}"
          if [ "${RUNNING:-0}" -ge 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "已有另一个运行在执行中，跳过本次"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout master
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ref: master

      - name: Set up python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Random sleep
        if: github.event_name == 'schedule' && steps.guard.outputs.skip != 'true'
        run: sleep $(shuf -i 10-300 -n 1)

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sign
        if: steps.guard.outputs.skip != 'true'
        env:
          SCKEY: ${{ secrets.SCKEY }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          EMAIL2: ${{ secrets.EMAIL2 }}
          PASSWORD2: ${{ secrets.PASSWORD2 }}
          BASE_URL2: ${{ secrets.BASE_URL2 }}
          PANEL2: ${{ secrets.PANEL2 }}
          TGBOT: ${{ secrets.TGBOT }}
          TGUSERID: ${{ secrets.TGUSERID }}
        run: |
          python3 ./main.py
